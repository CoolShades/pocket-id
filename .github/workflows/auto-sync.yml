name: Auto-sync with upstream releases

# Daily: if upstream has published a new release that the feature branch does
# not contain yet, sync main to the release tag, REBASE the feature commits
# onto it, resolve conflicts automatically (union merge driver for append-only
# hotspots, then OpenCode driving Qwen Flash-Next on coolshades-hpc for the
# rest), run the verification gate (go build + unit tests, frontend build +
# svelte-check, both Dockerfiles) and force-push the feature branch. Only when
# that fails is a human asked, via a single issue per release.
#
# Two jobs: `check` is a cheap no-op most days; `sync` joins the tailnet as an
# ephemeral node (tailscale/github-action, tag:ci) so it can reach the model on
# hpc, then leaves. The ACL only lets tag:ci reach hpc:18020.
#
# Secrets / variables:
#   SYNC_PAT              PAT with contents+workflows write (push main/feature)
#   TS_OAUTH_CLIENT_ID    Tailscale OAuth client (scope auth_keys write, tag:ci)
#   TS_OAUTH_SECRET
#   HPC_QWEN_API_KEY      vLLM API key on hpc                 (secret)
#   HPC_QWEN_BASE_URL     e.g. http://100.125.96.35:18020/v1  (variable)
# Scripts live in .github/sync/ and can be run locally the same way.

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Feature branch to rebase onto the latest release"
        required: false
        default: "feat/dynamic-background"

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: pocket-id/pocket-id
  TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'feat/dynamic-background' }}
  GH_REPO: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      synced: ${{ steps.check.outputs.synced }}
    steps:
      - name: Find latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api "repos/${{ env.UPSTREAM_REPO }}/releases/latest" --jq .tag_name)
          [ -n "$TAG" ] || { echo "::error::Could not determine the latest upstream release."; exit 1; }
          echo "Latest upstream release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check whether the release is already synced
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.release.outputs.tag }}
          # compare BASE...HEAD: "behind"/"identical" = HEAD (the release) is already an ancestor of BASE (the feature branch)
          STATUS=$(gh api "repos/${{ env.GH_REPO }}/compare/${{ env.TARGET_BRANCH }}...${UPSTREAM_REPO%%/*}:${TAG}" --jq .status)
          # "behind" or "identical" = the release commit is already an ancestor of the feature branch
          if [ "$STATUS" = "behind" ] || [ "$STATUS" = "identical" ]; then
            echo "Release ${TAG} is already contained in ${{ env.TARGET_BRANCH }} — nothing to do."
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${TAG} is not yet in ${{ env.TARGET_BRANCH }} (compare status: ${STATUS}) — syncing."
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: check
    if: needs.check.outputs.synced == 'false'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
      SYNC_AGENT: opencode
      HPC_QWEN_BASE_URL: ${{ vars.HPC_QWEN_BASE_URL }}
      HPC_QWEN_API_KEY: ${{ secrets.HPC_QWEN_API_KEY }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Join the tailnet (ephemeral node, tag:ci)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.125.96.35

      - name: Check the model on hpc is reachable
        run: |
          curl -sS -m 20 -H "Authorization: Bearer ${HPC_QWEN_API_KEY}" "${HPC_QWEN_BASE_URL}/models" \
            | jq -r '.data[].id' | sed 's/^/model: /'

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream main --tags

      # ---- toolchain -----------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install OpenCode
        run: |
          npm install -g opencode-ai@1.19.0
          opencode --version

      # ---- sync ---------------------------------------------------------------
      - name: Sync origin/main to the release tag
        run: |
          git checkout main
          if git merge-base --is-ancestor main "${TAG}^{commit}"; then
            git merge --ff-only "${TAG}^{commit}"
          else
            # main carries the fork's workflow + sync scripts, so a real merge.
            git merge --no-edit "$TAG" || {
              echo "::error::Conflict merging release ${TAG} into origin/main. Resolve manually."
              exit 1
            }
          fi
          git push origin main

      - name: Rebase ${{ env.TARGET_BRANCH }} onto main
        id: rebase
        env:
          SYNC_CONFLICTS_FILE: ${{ runner.temp }}/conflicts.txt
        run: |
          set -o pipefail
          # Run the scripts from outside the tree: the checkout switches branches underneath them.
          rm -rf "${{ runner.temp }}/sync" && cp -r .github/sync "${{ runner.temp }}/sync"
          git branch -f ${{ env.TARGET_BRANCH }} origin/${{ env.TARGET_BRANCH }}
          if "${{ runner.temp }}/sync/rebase.sh" "$TAG" main "${{ env.TARGET_BRANCH }}" 2>&1 | tee "${{ runner.temp }}/rebase.log"; then
            echo "status=rebased" >> "$GITHUB_OUTPUT"
          else
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify
        id: verify
        if: steps.rebase.outputs.status == 'rebased'
        run: |
          set -o pipefail
          LOG="${{ runner.temp }}/verify.log"
          SYNC="${{ runner.temp }}/sync"
          if "$SYNC/verify.sh" 2>&1 | tee "$LOG"; then
            echo "status=passed" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "verify failed — asking the agent to fix it"
          if "$SYNC/ai-assist.sh" verify "$TAG" "$LOG"; then
            git add -A
            git commit --amend --no-edit
            if "$SYNC/verify.sh" 2>&1 | tee "$LOG"; then
              echo "status=passed" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "status=failed" >> "$GITHUB_OUTPUT"

      - name: Push rebased ${{ env.TARGET_BRANCH }}
        if: steps.verify.outputs.status == 'passed'
        run: |
          git push --force-with-lease origin ${{ env.TARGET_BRANCH }}
          echo "Pushed ${{ env.TARGET_BRANCH }} rebased onto ${TAG}."

      # ---- a human is needed ---------------------------------------------------
      - name: Ask for help
        if: always() && steps.verify.outputs.status != 'passed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET=${{ env.TARGET_BRANCH }}
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="${{ runner.temp }}/issue.md"

          if [ "${{ steps.rebase.outputs.status }}" = "conflict" ]; then
            TITLE="auto-sync: ${TAG} needs a hand (merge conflict)"
            {
              echo "Rebasing **${TARGET}** onto **upstream release ${TAG}** stopped on conflicts the job could not resolve ([run](${RUN_URL}))."
              echo; echo "Conflicting files:"; echo '```'
              cat "${{ runner.temp }}/conflicts.txt" 2>/dev/null || echo "(see run log)"
              echo '```'
              echo; echo "### Resolve locally"; echo '```bash'
              echo "git fetch origin && git checkout ${TARGET} && git reset --hard origin/${TARGET}"
              echo ".github/sync/rebase.sh ${TAG} origin/main ${TARGET}   # needs opencode + HPC_QWEN_* in the env, or SYNC_AGENT=claude"
              echo "# or: git rebase origin/main, resolve, git rebase --continue"
              echo ".github/sync/verify.sh"
              echo "git push --force-with-lease origin ${TARGET}"
              echo '```'
            } > "$BODY"
          elif [ "${{ steps.rebase.outputs.status }}" = "rebased" ]; then
            ATTEMPT="sync-attempt/${TAG}"
            git push --force origin "HEAD:refs/heads/${ATTEMPT}"
            TITLE="auto-sync: ${TAG} needs a hand (verification failed)"
            {
              echo "**${TARGET}** was rebased onto **upstream release ${TAG}** but the verification gate failed, so nothing was pushed to ${TARGET} ([run](${RUN_URL}))."
              echo "The rebased state is on branch \`${ATTEMPT}\`."
              echo; echo "<details><summary>verify.sh output (tail)</summary>"; echo; echo '```'
              tail -n 120 "${{ runner.temp }}/verify.log"
              echo '```'; echo "</details>"
              echo; echo "### Fix locally"; echo '```bash'
              echo "git fetch origin && git checkout ${ATTEMPT}"
              echo "# fix, then:"
              echo ".github/sync/verify.sh && git commit -a --amend --no-edit"
              echo "git push --force origin HEAD:${TARGET}"
              echo '```'
            } > "$BODY"
          else
            TITLE="auto-sync: ${TAG} needs a hand (job failed before the rebase)"
            echo "The sync job for **${TAG}** failed before reaching the rebase step — see the [run](${RUN_URL})." > "$BODY"
          fi

          gh label create sync-conflict --color EA8A00 \
            --description "Upstream release sync that needs a human" 2>/dev/null || true

          # One open issue per release; older ones are superseded.
          EXISTING=$(gh issue list --label sync-conflict --state open --json number,title \
            --jq ".[] | select(.title | contains(\"${TAG} \")) | .number" | head -1)
          gh issue list --label sync-conflict --state open --json number,title \
            --jq ".[] | select(.title | contains(\"${TAG} \") | not) | .number" \
            | while read -r n; do gh issue close "$n" -c "Superseded by the sync of ${TAG}."; done
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -F "$BODY"
          else
            gh issue create --title "$TITLE" --label sync-conflict -F "$BODY"
          fi
          echo "::error::${TITLE}"
          exit 1
