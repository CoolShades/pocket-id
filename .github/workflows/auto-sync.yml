name: Auto-sync with upstream releases

# Checks daily whether the upstream repo has published a new release.
# Between releases every run is a cheap no-op; when a new release tag
# appears, main is synced to that tag and then merged into the feature
# branch. Commits that land on upstream main between releases are
# deliberately ignored until they ship in a release.

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Feature branch to merge main into"
        required: false
        default: "feat/dynamic-background"

permissions:
  contents: write
  pull-requests: write
  issues: write   # required so `gh label create` can create the sync-conflict label

env:
  UPSTREAM_REPO: pocket-id/pocket-id
  TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'feat/dynamic-background' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # PAT with `workflows: write` — required because upstream periodically
          # edits files under .github/workflows/, and the default GITHUB_TOKEN
          # is not allowed to push such changes.
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `releases/latest` excludes drafts and prereleases, so this only
          # moves when a proper release is published.
          TAG=$(gh api "repos/${{ env.UPSTREAM_REPO }}/releases/latest" --jq .tag_name)
          if [ -z "$TAG" ]; then
            echo "::error::Could not determine the latest upstream release."
            exit 1
          fi
          echo "Latest upstream release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream main --tags

      - name: Check whether the release is already synced
        id: check
        run: |
          TAG=${{ steps.release.outputs.tag }}
          TAG_COMMIT=$(git rev-parse "${TAG}^{commit}")
          if git merge-base --is-ancestor "$TAG_COMMIT" "origin/${{ env.TARGET_BRANCH }}"; then
            echo "Release ${TAG} is already contained in ${{ env.TARGET_BRANCH }} — nothing to do."
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${TAG} is not yet in ${{ env.TARGET_BRANCH }} — syncing."
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync origin/main to the release tag
        if: steps.check.outputs.synced == 'false'
        run: |
          TAG=${{ steps.release.outputs.tag }}
          git checkout main
          if git merge-base --is-ancestor main "${TAG}^{commit}"; then
            # Fast-forward is possible — main is strictly behind the release
            git merge --ff-only "${TAG}^{commit}"
          else
            # main has diverged (expected: this workflow file lives here).
            # Perform a real merge so both histories are preserved.
            git merge --no-edit "$TAG" || {
              echo "::error::Conflict merging release ${TAG} into origin/main. Resolve manually."
              exit 1
            }
          fi
          git push origin main

      - name: Attempt merge of main into ${{ env.TARGET_BRANCH }}
        id: merge
        if: steps.check.outputs.synced == 'false'
        run: |
          git checkout ${{ env.TARGET_BRANCH }}
          git pull --ff-only origin ${{ env.TARGET_BRANCH }} || true
          if git merge --no-edit main; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push merged target branch
        if: steps.merge.outputs.status == 'clean'
        run: |
          if git diff --quiet origin/${{ env.TARGET_BRANCH }} HEAD; then
            echo "No new commits to push — already up to date."
            exit 0
          fi
          git push origin ${{ env.TARGET_BRANCH }}

      - name: Open sync-conflict PR
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this, gh defaults to the upstream parent for `pr create` / `pr list` /
          # `label create` on fork checkouts, which is wrong — we want the fork.
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=${{ steps.release.outputs.tag }}

          # If a previous sync-conflict PR is still open, do not open another
          # one — resolve and merge it first, then the next run picks up
          # whatever is still outstanding.
          EXISTING=$(gh pr list \
            --base ${{ env.TARGET_BRANCH }} \
            --state open \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("sync-conflict/"))] | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "::error::Sync conflict from main into ${{ env.TARGET_BRANCH }}, and PR #${EXISTING} is still open. Resolve and merge it first — no new PR was opened."
            exit 1
          fi

          BRANCH="sync-conflict/${TAG}"
          git checkout -B "$BRANCH" ${{ env.TARGET_BRANCH }}
          # Re-do the merge so the conflict markers land on the sync-conflict branch
          git merge --no-edit main || true
          git add -A
          git commit -m "WIP: sync conflict merging release ${TAG} into ${{ env.TARGET_BRANCH }}

          This commit contains the merge conflict markers. Resolve them, then
          merge this PR into ${{ env.TARGET_BRANCH }}."
          git push -u origin "$BRANCH" --force

          # Ensure the sync-conflict label exists (forks don't inherit upstream labels).
          gh label create sync-conflict \
            --color EA8A00 \
            --description "Auto-opened PR carrying conflict markers from upstream release sync" \
            2>/dev/null || true

          gh pr create \
            --base ${{ env.TARGET_BRANCH }} \
            --head "$BRANCH" \
            --title "auto-sync: resolve conflicts from release ${TAG} into ${{ env.TARGET_BRANCH }}" \
            --body "Syncing **upstream release ${TAG}** into **${{ env.TARGET_BRANCH }}** hit a merge conflict.

          ### Resolve locally

          \`\`\`bash
          git fetch origin
          git checkout ${BRANCH}
          # resolve conflict markers in the affected files
          git add -A
          git commit --amend --no-edit
          git push --force-with-lease
          \`\`\`

          Then merge this PR." \
            --label "sync-conflict"

          # Even when the PR step succeeds, a conflict is a condition the user must act on.
          # Fail the job so the Actions UI turns red and GitHub emails on failure.
          echo "::error::Sync conflict merging release ${TAG} into ${{ env.TARGET_BRANCH }} — see PR for ${BRANCH}."
          exit 1
